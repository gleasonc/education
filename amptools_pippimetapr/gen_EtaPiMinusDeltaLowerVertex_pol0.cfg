# -a 8.0 -b 9.0
# gen_amp config for gamma p -> eta' pi- Delta++, Delta++ -> p pi+ (lower vertex),
# with an a2(1320) D1 wave and a pi1 P1 wave in both reflectivities.
# Only the positive-reflectivity waves are switched on (negative ones start at 0).
# Final-state order of the output tree: Proton EtaPrime Pi- Pi+, as expected by
# fit_etaprpim_SPD_TEMPLATE.cfg.  Example:
#   gen_amp -c gen_EtaPiMinusDeltaLowerVertex_pol0.cfg -o gen_pol0.root \
#           -l 1.1 -u 2.6 -n 100000 -a 8.0 -b 9.0
#####################################
####    THIS IS A CONFIG FILE    ####
#####################################
##
##  Blank lines or lines beginning with a "#" are ignored.
##
##  Double colons (::) are treated like a space.
##     This is sometimes useful for grouping (for example,
##     grouping strings like "reaction::sum::amplitudeName")
##
##  All non-comment lines must begin with one of the following keywords.
##
##  (note:  <word> means necessary 
##      (word) means optional)
##
##  include   <file>
##  define    <word> (defn1) (defn2) (defn3) ...
##  fit       <fitname>
##  keyword   <keyword> <min arguments> <max arguments>
##  reaction      <reaction> <particle1> <particle2> (particle3) ...
##  data      <reaction> <class> (arg1) (arg2) (arg3) ...
##  genmc     <reaction> <class> (arg1) (arg2) (arg3) ...
##  accmc     <reaction> <class> (arg1) (arg2) (arg3) ...
##  normintfile   <reaction> <file>
##  sum       <reaction> <sum> (sum2) (sum3) ...
##  amplitude     <reaction> <sum> <amp> <class> (arg1) (arg2) ([par]) ... 
##  initialize    <reaction> <sum> <amp> <"events"/"polar"/"cartesian">
##          <value1> <value2> ("fixed"/"real")
##  scale     <reaction> <sum> <amp> <value or [parameter]>
##  constrain     <reaction1> <sum1> <amp1> <reaction2> <sum2> <amp2> ...
##  permute   <reaction> <sum> <amp> <index1> <index2> ...
##  parameter     <par> <value> ("fixed"/"bounded"/"gaussian") 
##          (lower/central) (upper/error)
##    DEPRECATED:
##  datafile      <reaction> <file> (file2) (file3) ...
##  genmcfile     <reaction> <file> (file2) (file3) ...
##  accmcfile     <reaction> <file> (file2) (file3) ...
##
#####################################
define polVal 0.3519

#define resonances
define pi1 1.564 0.492
define atwo 1.320 0.110

# Delta++ -> p pi+ at the lower vertex (mass width particles)
define deltapp 1.232 0.100
keyword lowerVertex 4 6
lowerVertex deltapp Proton Pi+

# Uniform angles: flat=1; YLMs: flat=0;

fit EtaPi_fit

reaction EtaPi Beam Proton EtaPrime Pi- Pi+

sum EtaPi NegativeRe
sum EtaPi NegativeIm
sum EtaPi PositiveRe
sum EtaPi PositiveIm

# Zlm as suggested in GlueX doc-4094 (M. Shepherd)
# argument 1 : j
# argument 2 : m
# argument 3 : real (+1) or imaginary (-1) part
# argument 4 : 1 + (+1/-1) * P_gamma
# argument 5 : polarization angle
# argument 6 : beam properties config file or fixed polarization

parameter polAngle 0.0 fixed

# a0(980)

#amplitude EtaPi::NegativeRe::S0- Zlm 0 0 +1 -1 polAngle polVal
#amplitude EtaPi::NegativeRe::S0- BreitWigner a0 0 2 3

#amplitude EtaPi::PositiveIm::S0+ Zlm 0 0 -1 -1 polAngle polVal
#amplitude EtaPi::PositiveIm::S0+ BreitWigner a0 0 2 3

#amplitude EtaPi::PositiveRe::S0+ Zlm 0 0 +1 +1 polAngle polVal
#amplitude EtaPi::PositiveRe::S0+ BreitWigner a0 0 2 3

#amplitude EtaPi::NegativeIm::S0- Zlm 0 0 -1 +1 polAngle polVal
#amplitude EtaPi::NegativeIm::S0- BreitWigner a0 0 2 3

# a2(1320)

amplitude EtaPi::NegativeRe::D1- Zlm 2 1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::D1- BreitWigner atwo 2 2 3
amplitude EtaPi::NegativeRe::D1- BreitWigner deltapp 1 1 4

amplitude EtaPi::PositiveIm::D1+ Zlm 2 1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::D1+ BreitWigner atwo 2 2 3
amplitude EtaPi::PositiveIm::D1+ BreitWigner deltapp 1 1 4

amplitude EtaPi::PositiveRe::D1+ Zlm 2 1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::D1+ BreitWigner atwo 2 2 3
amplitude EtaPi::PositiveRe::D1+ BreitWigner deltapp 1 1 4

amplitude EtaPi::NegativeIm::D1- Zlm 2 1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::D1- BreitWigner atwo 2 2 3
amplitude EtaPi::NegativeIm::D1- BreitWigner deltapp 1 1 4

# pi1

amplitude EtaPi::NegativeRe::P1- Zlm 1 1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::P1- BreitWigner pi1 1 2 3
amplitude EtaPi::NegativeRe::P1- BreitWigner deltapp 1 1 4

amplitude EtaPi::PositiveIm::P1+ Zlm 1 1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::P1+ BreitWigner pi1 1 2 3
amplitude EtaPi::PositiveIm::P1+ BreitWigner deltapp 1 1 4

amplitude EtaPi::PositiveRe::P1+ Zlm 1 1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::P1+ BreitWigner pi1 1 2 3
amplitude EtaPi::PositiveRe::P1+ BreitWigner deltapp 1 1 4

amplitude EtaPi::NegativeIm::P1- Zlm 1 1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::P1- BreitWigner pi1 1 2 3
amplitude EtaPi::NegativeIm::P1- BreitWigner deltapp 1 1 4

# initialize only positive reflectivity components

initialize EtaPi::NegativeRe::D1- cartesian 0.0 0.0 real
initialize EtaPi::PositiveIm::D1+ cartesian 25.0 0.0 real
initialize EtaPi::PositiveRe::D1+ cartesian 25.0 0.0 real
initialize EtaPi::NegativeIm::D1- cartesian 0.0 0.0 real

initialize EtaPi::NegativeRe::P1- cartesian 0.0 0.0
initialize EtaPi::PositiveIm::P1+ cartesian 50.0 50.0
initialize EtaPi::PositiveRe::P1+ cartesian 50.0 50.0
initialize EtaPi::NegativeIm::P1- cartesian 0.0 0.0

# Re/Im sums of a wave share one production coefficient
constrain EtaPi::NegativeRe::P1- EtaPi::NegativeIm::P1-
constrain EtaPi::PositiveIm::P1+ EtaPi::PositiveRe::P1+
constrain EtaPi::PositiveIm::D1+ EtaPi::PositiveRe::D1+
constrain EtaPi::NegativeRe::D1- EtaPi::NegativeIm::D1-
