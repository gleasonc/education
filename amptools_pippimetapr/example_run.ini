# Settings for amptools_auto.py, gamma p -> eta' pi- pi+ p
# (final-state order in the trees: Proton EtaPrime Pi- Pi+).  Run with:
#     python3 amptools_auto.py all -c example_run.ini
# Any option on the command line overrides the value here.
# Relative paths for samples, cfg, splitter, convert_script and plotter are taken
# relative to this file (or, if not found there, to the folder holding
# amptools_auto.py); workdir is relative to where you run the script.
# Leave a value empty to use the default.

[general]
workdir = EtaPrPi_fit
jobs = 8                      # bins processed in parallel (fit, plotfit)

[samples]
# TOKEN = file; TOKEN is the word replaced in the config template
DATAFILE  = /path/to/pippimetapr/Simulation/Zlm/gen_pol0.root
ACCMCFILE = /path/to/acc_flat.root
GENMCFILE = /path/to/pippimetapr/Simulation/Zlm/gen_flat.root

[bin]
mass = 1.1 2.6 30             # M(eta' pi-): low high nbins
t = 0.1 0.3 1                 # -t to the p pi+ system: low high nbins; empty = mass bins only
t_log = false                 # logarithmic t bins
tree =                        # tree name, empty = kin
splitter = split_bins.C       # or split_mass (bins in M(eta' pi- pi+), not what you want here)
mass_indices = 1,2            # final-state particles whose mass is binned (1,2 = EtaPrime Pi-)
root_exe = root

[fit]
cfg = fit_etaprpim_SPD_TEMPLATE.cfg
fit_exe = fit
rand = 10                     # fit -r
rand_seed =                   # fit -rs
max_iter =                    # fit -m
min_ematrix =                 # fit -e  (0-3)
hesse = false                 # fit -H
minos = false                 # fit -n
param_init = auto             # include param_init.cfg? auto = only without rand; yes / no
fit_args =                    # anything else, e.g. -s seed.txt

[gather]
convert_script = convert_to_csv.py
acceptance_corrected = false  # convert_to_csv.py -a
convert_args =                # e.g. --phases P1+:D1+ --covariance
data_info = DATAFILE          # add per-bin event counts for this sample
data_info_args =              # e.g. --indices 0,3 for M(p pi+) instead of M(eta' pi-)

[plot]
format = pdf
only =                        # plot only these quantities, e.g. P1+ D1+ likelihood

[plotfit]
plotfit = true                # include the fit-quality step in 'all'
plotter = etapi_fit_plotter.py   # or a compiled etapi_delta_plotter
per_sum = false               # slower: also histograms for each sum
with_gen = false              # slower: also generated MC

[wavesets]
# Optional: fit several wave sets.  name = waves that float; every other wave
# in the template is fixed to 0.  The first wave of each reflectivity (+/-)
# is the real reference.  Data is binned once in workdir; each set is fit in
# workdir/<name>/, gather writes workdir/results_wavesets.csv and plot
# draws all sets together in workdir/plots_wavesets/.
# Shorthand: D1 = D1+ D1-,  D*+ = every positive D wave,  all = every wave.
# Run just some with --waveset NAME ...  Delete this section for one fit.
# P1D1 = D1+ P1+
# SPD  = D1+ S0+ P1+ D0+ D2+
# SPDb = S0 P1 D*
