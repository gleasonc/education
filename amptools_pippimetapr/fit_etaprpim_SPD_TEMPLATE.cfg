# -a 8.0 -b 9.0
# gamma p -> eta' pi- Delta++ (Delta++ -> p pi+), all S, P, D eta' pi- waves
# (L=0,1,2; all m = -L..L) in both reflectivities.
# Final-state order in the trees: Proton EtaPrime Pi- Pi+  (as in gen_pol0.root)
# Zlm takes the angles of particle 2 (EtaPrime) in the EtaPrime Pi- (2+3) rest frame.
# Every amplitude is multiplied by the same p pi+ Breit-Wigner (particles 1 and 4,
# the lowerVertex of the generator config), so the fit also describes M(p pi+).
# To fit without it, delete the "BreitWigner deltapp" lines.
#####################################
####	THIS IS A CONFIG FILE	 ####
#####################################
##
##  Blank lines or lines beginning with a "#" are ignored.
##
##  Double colons (::) are treated like a space.
##     This is sometimes useful for grouping (for example,
##     grouping strings like "reaction::sum::amplitudeName")
##
##  All non-comment lines must begin with one of the following keywords.
##
##  (note:  <word> means necessary 
##	    (word) means optional)
##
##  include	  <file>
##  define	  <word> (defn1) (defn2) (defn3) ...
##  fit 	  <fitname>
##  keyword	  <keyword> <min arguments> <max arguments>
##  reaction	  <reaction> <particle1> <particle2> (particle3) ...
##  data	  <reaction> <class> (arg1) (arg2) (arg3) ...
##  genmc	  <reaction> <class> (arg1) (arg2) (arg3) ...
##  accmc	  <reaction> <class> (arg1) (arg2) (arg3) ...
##  normintfile   <reaction> <file>
##  sum 	  <reaction> <sum> (sum2) (sum3) ...
##  amplitude	  <reaction> <sum> <amp> <class> (arg1) (arg2) ([par]) ... 
##  initialize    <reaction> <sum> <amp> <"events"/"polar"/"cartesian">
##		    <value1> <value2> ("fixed"/"real")
##  scale	  <reaction> <sum> <amp> <value or [parameter]>
##  constrain	  <reaction1> <sum1> <amp1> <reaction2> <sum2> <amp2> ...
##  permute	  <reaction> <sum> <amp> <index1> <index2> ...
##  parameter	  <par> <value> ("fixed"/"bounded"/"gaussian") 
##		    (lower/central) (upper/error)
##    DEPRECATED:
##  datafile	  <reaction> <file> (file2) (file3) ...
##  genmcfile	  <reaction> <file> (file2) (file3) ...
##  accmcfile	  <reaction> <file> (file2) (file3) ...
##
#####################################

define polVal 0.3519
# Delta++ mass and width for the p pi+ Breit-Wigner
define deltapp 1.232 0.100

fit FITNAME

reaction EtaPi Beam Proton EtaPrime Pi- Pi+

genmc EtaPi ROOTDataReader GENMCFILE
accmc EtaPi ROOTDataReader ACCMCFILE
data EtaPi ROOTDataReader DATAFILE

normintfile EtaPi NIFILE

sum EtaPi PositiveRe
sum EtaPi PositiveIm
sum EtaPi NegativeRe
sum EtaPi NegativeIm

# polarization angle in degrees; Zlm reads it as a plain number, so set it with define (like polVal)
define polAngle 0.0

# Naming: <L><m><reflectivity>, with 'n' marking negative m (e.g. Dn2+ = D-wave, m=-2, eps=+)
# Reference waves (phase fixed real): D1+ and D1-

########## Reflectivity positive ##########

# S0+
amplitude EtaPi::PositiveIm::S0+ Zlm 0 0 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::S0+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::S0+ Zlm 0 0 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::S0+ BreitWigner deltapp 1 1 4

# Pn1+
amplitude EtaPi::PositiveIm::Pn1+ Zlm 1 -1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::Pn1+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::Pn1+ Zlm 1 -1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::Pn1+ BreitWigner deltapp 1 1 4

# P0+
amplitude EtaPi::PositiveIm::P0+ Zlm 1 0 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::P0+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::P0+ Zlm 1 0 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::P0+ BreitWigner deltapp 1 1 4

# P1+
amplitude EtaPi::PositiveIm::P1+ Zlm 1 1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::P1+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::P1+ Zlm 1 1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::P1+ BreitWigner deltapp 1 1 4

# Dn2+
amplitude EtaPi::PositiveIm::Dn2+ Zlm 2 -2 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::Dn2+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::Dn2+ Zlm 2 -2 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::Dn2+ BreitWigner deltapp 1 1 4

# Dn1+
amplitude EtaPi::PositiveIm::Dn1+ Zlm 2 -1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::Dn1+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::Dn1+ Zlm 2 -1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::Dn1+ BreitWigner deltapp 1 1 4

# D0+
amplitude EtaPi::PositiveIm::D0+ Zlm 2 0 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::D0+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::D0+ Zlm 2 0 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::D0+ BreitWigner deltapp 1 1 4

# D1+  (reference wave)
amplitude EtaPi::PositiveIm::D1+ Zlm 2 1 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::D1+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::D1+ Zlm 2 1 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::D1+ BreitWigner deltapp 1 1 4

# D2+
amplitude EtaPi::PositiveIm::D2+ Zlm 2 2 -1 -1 polAngle polVal
amplitude EtaPi::PositiveIm::D2+ BreitWigner deltapp 1 1 4
amplitude EtaPi::PositiveRe::D2+ Zlm 2 2 +1 +1 polAngle polVal
amplitude EtaPi::PositiveRe::D2+ BreitWigner deltapp 1 1 4

########## Reflectivity negative ##########

# S0-
amplitude EtaPi::NegativeRe::S0- Zlm 0 0 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::S0- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::S0- Zlm 0 0 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::S0- BreitWigner deltapp 1 1 4

# Pn1-
amplitude EtaPi::NegativeRe::Pn1- Zlm 1 -1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::Pn1- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::Pn1- Zlm 1 -1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::Pn1- BreitWigner deltapp 1 1 4

# P0-
amplitude EtaPi::NegativeRe::P0- Zlm 1 0 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::P0- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::P0- Zlm 1 0 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::P0- BreitWigner deltapp 1 1 4

# P1-
amplitude EtaPi::NegativeRe::P1- Zlm 1 1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::P1- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::P1- Zlm 1 1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::P1- BreitWigner deltapp 1 1 4

# Dn2-
amplitude EtaPi::NegativeRe::Dn2- Zlm 2 -2 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::Dn2- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::Dn2- Zlm 2 -2 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::Dn2- BreitWigner deltapp 1 1 4

# Dn1-
amplitude EtaPi::NegativeRe::Dn1- Zlm 2 -1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::Dn1- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::Dn1- Zlm 2 -1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::Dn1- BreitWigner deltapp 1 1 4

# D0-
amplitude EtaPi::NegativeRe::D0- Zlm 2 0 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::D0- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::D0- Zlm 2 0 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::D0- BreitWigner deltapp 1 1 4

# D1-  (reference wave)
amplitude EtaPi::NegativeRe::D1- Zlm 2 1 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::D1- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::D1- Zlm 2 1 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::D1- BreitWigner deltapp 1 1 4

# D2-
amplitude EtaPi::NegativeRe::D2- Zlm 2 2 +1 -1 polAngle polVal
amplitude EtaPi::NegativeRe::D2- BreitWigner deltapp 1 1 4
amplitude EtaPi::NegativeIm::D2- Zlm 2 2 -1 +1 polAngle polVal
amplitude EtaPi::NegativeIm::D2- BreitWigner deltapp 1 1 4

#Starting Values
initialize EtaPi::PositiveIm::S0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::S0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::Pn1+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::Pn1+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::P0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::P0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::P1+ cartesian 10.0 10.0
initialize EtaPi::PositiveRe::P1+ cartesian 10.0 10.0
initialize EtaPi::PositiveIm::Dn2+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::Dn2+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::Dn1+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::Dn1+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::D0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::D0+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveIm::D1+ cartesian 100.0 0.0 real
initialize EtaPi::PositiveRe::D1+ cartesian 100.0 0.0 real
initialize EtaPi::PositiveIm::D2+ cartesian 0.0 0.0 fixed
initialize EtaPi::PositiveRe::D2+ cartesian 0.0 0.0 fixed

initialize EtaPi::NegativeRe::S0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::S0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::Pn1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::Pn1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::P0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::P0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::P1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::P1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::Dn2- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::Dn2- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::Dn1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::Dn1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::D0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::D0- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::D1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::D1- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeRe::D2- cartesian 0.0 0.0 fixed
initialize EtaPi::NegativeIm::D2- cartesian 0.0 0.0 fixed

# Re/Im sums share the same production coefficient
constrain EtaPi::PositiveIm::S0+ EtaPi::PositiveRe::S0+
constrain EtaPi::PositiveIm::Pn1+ EtaPi::PositiveRe::Pn1+
constrain EtaPi::PositiveIm::P0+ EtaPi::PositiveRe::P0+
constrain EtaPi::PositiveIm::P1+ EtaPi::PositiveRe::P1+
constrain EtaPi::PositiveIm::Dn2+ EtaPi::PositiveRe::Dn2+
constrain EtaPi::PositiveIm::Dn1+ EtaPi::PositiveRe::Dn1+
constrain EtaPi::PositiveIm::D0+ EtaPi::PositiveRe::D0+
constrain EtaPi::PositiveIm::D1+ EtaPi::PositiveRe::D1+
constrain EtaPi::PositiveIm::D2+ EtaPi::PositiveRe::D2+

constrain EtaPi::NegativeRe::S0- EtaPi::NegativeIm::S0-
constrain EtaPi::NegativeRe::Pn1- EtaPi::NegativeIm::Pn1-
constrain EtaPi::NegativeRe::P0- EtaPi::NegativeIm::P0-
constrain EtaPi::NegativeRe::P1- EtaPi::NegativeIm::P1-
constrain EtaPi::NegativeRe::Dn2- EtaPi::NegativeIm::Dn2-
constrain EtaPi::NegativeRe::Dn1- EtaPi::NegativeIm::Dn1-
constrain EtaPi::NegativeRe::D0- EtaPi::NegativeIm::D0-
constrain EtaPi::NegativeRe::D1- EtaPi::NegativeIm::D1-
constrain EtaPi::NegativeRe::D2- EtaPi::NegativeIm::D2-

#include param_init.cfg
