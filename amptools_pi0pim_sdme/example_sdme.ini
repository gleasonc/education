# Settings for amptools_sdme.py, gamma d -> pi- pi0 p (p missing)
# (final-state order in the trees: Proton Pi- Pi0, as the v2 DSelector writes).
# Run with:
#     python3 amptools_sdme.py all -c example_sdme.ini
# Any option on the command line overrides the value here.
# Relative paths for samples, cfg, cfg_single and splitter are taken relative to
# this file (or, if not found there, to the folder holding amptools_sdme.py);
# workdir is relative to where you run the script.
# Leave a value empty to use the default.

[general]
workdir = SDME_fit
jobs = 8                      # fits run in parallel

[samples]
# TOKEN = file.  In the 4-pol template every TOKEN is used as TOKEN_00 ... TOKEN_135.
DATAFILE  = /path/to/amptools_gd_pi0pimprotmissprot__B4_F4_T2_S2_v2.root
ACCMCFILE = /path/to/amptools_acc_flat.root
GENMCFILE = /path/to/amptools_gen_flat.root

[polarization]
orientations = 00:0 45:45 90:90 135:135   # token suffix : value of the pol branch
split = DATAFILE              # samples split by orientation; the others are used
                              # whole for every orientation (e.g. MC without pol)
pol_branch = pol

[bin]
mass = 0.6 0.95 1             # M(pi- pi0): low high nbins
t = 0.1 1.1 10                # -t to the pi- pi0 system: low high nbins; empty = mass bins only
t_log = false                 # logarithmic t bins
tree =                        # tree name, empty = kin
splitter = split_bins.C
mass_indices = 1,2            # final-state particles whose mass is binned (1,2 = Pi- Pi0)
root_exe = root

[fit]
cfg = fit_pi0pim_SDME_4pol_TEMPLATE.cfg          # combined fit of all orientations; empty = skip
cfg_single = fit_pi0pim_SDME_1pol_TEMPLATE.cfg   # one fit per orientation; empty = skip
fit_exe = fit
rand =                        # fit -r (randomized starts, SDMEs too with parSDME)
rand_seed =                   # fit -rs
max_iter =                    # fit -m
min_ematrix =                 # fit -e  (0-3)
hesse = false                 # fit -H
minos = false                 # fit -n
fit_args =                    # anything else, e.g. -s seed.txt

[plot]
format = pdf                  # or png (also writes image files)
ylim = 0.5                    # SDME plots from -ylim to ylim
fits =                        # plot only these fits, e.g. all pol00; empty = every fit

[plotfit]
plotfit = true                # include the fit-quality plots in 'all'
plotter = sdme_fit_plotter.py
