# SDME fit of gamma p(n) -> rho- p (p missing), rho- -> pi- pi0, with TwoPiAngles,
# all four polarization orientations in one fit with shared SDMEs.
# Filled in per bin by amptools_sdme.py: FITNAME and the <SAMPLE>_<orientation>
# tokens (DATAFILE_00 ... ACCMCFILE_135).
# Tree order (v2 DSelector): beam, then proton, pi-, pi0 (TwoPiAngles: recoil, p1, p2).

fit FITNAME

#####################################
# POLARIZATION
#####################################
define polVal_00 0.3519
define polVal_45 0.3374
define polVal_90 0.3303
define polVal_135 0.3375

define polAngle_00 0.0
define polAngle_45 45.0
define polAngle_90 90.0
define polAngle_135 135.0

parameter parScale00 1.0 fixed
parameter parScale45 1.0
parameter parScale90 1.0
parameter parScale135 1.0

#####################################
# LOOP STATEMENTS
#####################################
loop LOOPREAC Pi0Pim_00 Pi0Pim_45 Pi0Pim_90 Pi0Pim_135
loop LOOPDATA DATAFILE_00 DATAFILE_45 DATAFILE_90 DATAFILE_135
loop LOOPGENMC GENMCFILE_00 GENMCFILE_45 GENMCFILE_90 GENMCFILE_135
loop LOOPACCMC ACCMCFILE_00 ACCMCFILE_45 ACCMCFILE_90 ACCMCFILE_135

loop LOOPPOLANG polAngle_00 polAngle_45 polAngle_90 polAngle_135
loop LOOPPOLVAL polVal_00 polVal_45 polVal_90 polVal_135
loop LOOPSCALE [parScale00] [parScale45] [parScale90] [parScale135]

#####################################
# REACTIONS AND DATA
#####################################
reaction LOOPREAC Beam Proton Pi- Pi0

sum LOOPREAC xpol

genmc LOOPREAC ROOTDataReader LOOPGENMC
accmc LOOPREAC ROOTDataReader LOOPACCMC
data LOOPREAC ROOTDataReader LOOPDATA

#####################################
# SDMEs (shared by all orientations)
#####################################
parameter rho000 0.0 bounded -1.0 1.0
parameter rho100 0.0 bounded -1.0 1.0
parameter rho1m10 0.0 bounded -1.0 1.0
parameter rho111 0.0 bounded -1.0 1.0
parameter rho001 0.0 bounded -1.0 1.0
parameter rho101 0.0 bounded -1.0 1.0
parameter rho1m11 0.5 bounded -1.0 1.0
parameter rho102 0.0 bounded -1.0 1.0
parameter rho1m12 -0.5 bounded -1.0 1.0

# with fit -r: start every randomized fit from random SDMEs that form a valid
# density matrix (halld_sim fit's parSDME keyword; ignored by older versions)
keyword parSDME 1 1
parSDME rho000
parSDME rho100
parSDME rho1m10
parSDME rho111
parSDME rho001
parSDME rho101
parSDME rho1m11
parSDME rho102
parSDME rho1m12

amplitude LOOPREAC::xpol::rhoS TwoPiAngles [rho000] [rho100] [rho1m10] [rho111] [rho001] [rho101] [rho1m11] [rho102] [rho1m12] LOOPPOLANG LOOPPOLVAL

initialize LOOPREAC::xpol::rhoS cartesian 614.1 0.0 real
scale LOOPREAC::xpol::rhoS LOOPSCALE

constrain Pi0Pim_00::xpol::rhoS Pi0Pim_45::xpol::rhoS
constrain Pi0Pim_00::xpol::rhoS Pi0Pim_90::xpol::rhoS
constrain Pi0Pim_00::xpol::rhoS Pi0Pim_135::xpol::rhoS
